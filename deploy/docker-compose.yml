# Run: put DOMAIN=chat.example.com, LIVEKIT_API_KEY and LIVEKIT_API_SECRET in deploy/.env (DNS must point at this server,
# and ports 80 and 443 must be open). Then: docker compose -f deploy/docker-compose.yml up -d --build
# Only Caddy (80/443) is reachable from outside; the server and LiveKit signalling sit behind it.
# Compose stops if the LiveKit keys are missing (see deploy/bundle/.env.example).
services:
  caddy:
    image: caddy:2
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    ports: ["80:80", "443:443"]
    depends_on: [server, livekit]
    restart: unless-stopped
  livekit:
    image: livekit/livekit-server:latest
    command: '--config /etc/livekit.yaml --keys "${LIVEKIT_API_KEY:?set LIVEKIT_API_KEY in deploy/.env}: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET in deploy/.env}"'
    volumes: ["./livekit.yaml:/etc/livekit.yaml:ro"]
    ports: ["7881:7881", "50000-50100:50000-50100/udp"]
    restart: unless-stopped
  server:
    build: { context: .., dockerfile: deploy/Dockerfile.server }
    environment:
      PORT: 3000
      DATA_DIR: /data
      UPLOADS_DIR: /data/uploads   # move to a mounted block-storage disk later
      UPDATES_DIR: /updates        # desktop installer feed, filled by the release workflow (deploy/updates on the host)
      CHATWARD_VERSION: ${CHATWARD_VERSION:-dev}   # set by deploy/update-cloud.sh
      MIN_CLIENT_VERSION: ${MIN_CLIENT_VERSION:-0.0.0}   # optional, set in deploy/.env to force clients to update
      LIVEKIT_URL: wss://${DOMAIN:?set DOMAIN in deploy/.env}
      LIVEKIT_API_URL: http://livekit:7880   # the server reaches LiveKit inside Docker, not through the public URL
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?set LIVEKIT_API_KEY in deploy/.env}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET in deploy/.env}
      NODE_ENV: production
      TRUST_PROXY: 1   # Caddy is in front of this server, so it sends the real client IP in X-Forwarded-For
      KLIPY_API_KEY: ${KLIPY_API_KEY:-}
    volumes: ["chatward-data:/data", "./updates:/updates:ro"]
    expose: ["3000"]
    restart: unless-stopped
volumes:
  chatward-data:
  caddy-data:
  caddy-config:
