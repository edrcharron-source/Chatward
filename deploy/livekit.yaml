# LiveKit SFU config (dev keys). Production: change keys, add TURN/TLS.
# use_external_ip: LiveKit asks a STUN server for the public IP and tells clients to use it.
# Needed on a cloud server (AWS Lightsail) where the machine only sees a private IP.
port: 7880
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  use_external_ip: true
keys:
  devkey: secret
