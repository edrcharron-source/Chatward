services:
  livekit:
    image: livekit/livekit-server:latest
    command: '--config /etc/livekit.yaml --keys "${LIVEKIT_API_KEY:?set LIVEKIT_API_KEY in .env}: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET in .env}"'
    volumes: ["./livekit.yaml:/etc/livekit.yaml:ro"]
    ports: ["7880:7880", "7881:7881", "50000-50100:50000-50100/udp"]
    restart: unless-stopped
  server:
    build: { context: ., dockerfile: Dockerfile }
    env_file: [.env]
    environment:
      PORT: 3000
      DATA_DIR: /data
      UPLOADS_DIR: /data/uploads
      UPDATES_DIR: /updates
      CHATWARD_VERSION: ${CHATWARD_VERSION:-dev}
      MIN_CLIENT_VERSION: ${MIN_CLIENT_VERSION:-0.0.0}
      LIVEKIT_URL: ${LIVEKIT_URL:-ws://localhost:7880}
      LIVEKIT_API_URL: http://livekit:7880   # the server reaches LiveKit inside Docker, not through localhost
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?set LIVEKIT_API_KEY in .env}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET in .env}
    volumes: ["chatward-data:/data", "./updates:/updates:ro"]
    ports: ["3000:3000"]
    restart: unless-stopped
volumes:
  chatward-data:
