# LiveKit SFU config. API keys are not stored here: compose passes them from .env with --keys.
# use_external_ip: LiveKit asks a STUN server for the public IP and tells every client to
# connect to it. Required on a cloud server (AWS Lightsail) where the machine only sees a private IP.
# Production: add TURN/TLS.
port: 7880
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  use_external_ip: true
