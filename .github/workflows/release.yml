name: Release
on:
  workflow_dispatch:
    inputs:
      tag: { description: 'Release tag, e.g. v0.1.0', required: true }
permissions:
  contents: write
jobs:
  windows-app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build -w @chatward/shared
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with: { name: win, path: packages/client/release/*.exe }
  server-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble server bundle
        run: |
          d=chatward-server; mkdir -p $d/packages/client
          cp -r deploy/bundle/. $d/
          cp package.json package-lock.json tsconfig.base.json $d/
          cp -r packages/shared packages/server $d/packages/
          cp packages/client/package.json $d/packages/client/
          rm -rf $d/packages/*/node_modules $d/packages/*/dist
          zip -qr chatward-server.zip $d
      - uses: actions/upload-artifact@v4
        with: { name: server, path: chatward-server.zip }
  publish:
    needs: [windows-app, server-bundle]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist }
      - name: Create release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          cd dist
          for f in win/*Setup*.exe; do cp "$f" Chatward-Setup.exe; done
          gh release create "${{ inputs.tag }}" --repo "${{ github.repository }}" \
            --title "Chatward ${{ inputs.tag }}" --notes "Test build. Download Chatward-Setup.exe (the app) and chatward-server.zip (the server). See README inside the zip." \
            Chatward-Setup.exe server/chatward-server.zip
