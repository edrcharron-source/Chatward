name: Release
on:
  workflow_dispatch:
    inputs:
      tag: { description: 'Release tag, e.g. v0.1.0', required: true }
permissions:
  contents: write
# Two releases at once would race on the server's update feed.
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  windows-app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Set app version from the release tag
        env: { TAG: '${{ inputs.tag }}' }
        shell: bash
        run: npm version "${TAG#v}" --no-git-tag-version --allow-same-version -w @chatward/client
      - run: npm run build -w @chatward/shared
      - run: npm run dist:win
        env:
          CHATWARD_DEFAULT_SERVER: ${{ vars.CHATWARD_DEFAULT_SERVER || 'https://chat.lebserver.com' }}
      - uses: actions/upload-artifact@v4
        with:
          name: win
          # Only handed to the publish job; the GitHub Release keeps the real copy.
          retention-days: 1
          path: |
            packages/client/release/*.exe
            packages/client/release/latest.yml
            packages/client/release/*.blockmap
  server-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Assemble server bundle
        run: |
          d=chatward-server; mkdir -p $d/packages/client
          cp -r deploy/bundle/. $d/
          echo "${{ inputs.tag }}" | sed 's/^v//' > $d/VERSION
          cp package.json package-lock.json tsconfig.base.json $d/
          cp -r packages/shared packages/server $d/packages/
          cp packages/client/package.json $d/packages/client/
          rm -rf $d/packages/*/node_modules $d/packages/*/dist
          zip -qr chatward-server.zip $d
      - uses: actions/upload-artifact@v4
        with: { name: server, path: chatward-server.zip, retention-days: 1 }
  publish:
    needs: [windows-app, server-bundle]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist }
      - name: Create release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          cd dist
          cp win/Chatward-Setup.exe Chatward-Setup.exe
          gh release create "${{ inputs.tag }}" --repo "${{ github.repository }}" \
            --title "Chatward ${{ inputs.tag }}" --notes "Test build. Download Chatward-Setup.exe and install it. To try the app with no server, click Try demo on the login screen. chatward-server.zip is only needed for a real server (needs Docker Desktop)." \
            Chatward-Setup.exe server/chatward-server.zip
      - name: Publish update feed to the server
        env:
          SSH_HOST: ${{ secrets.UPDATE_SSH_HOST }}
          SSH_USER: ${{ secrets.UPDATE_SSH_USER }}
          SSH_KEY: ${{ secrets.UPDATE_SSH_KEY }}
          SSH_HOST_KEY: ${{ secrets.UPDATE_SSH_HOST_KEY }}
          DEPLOY_DIR: ${{ secrets.UPDATE_DEPLOY_DIR }}
        run: |
          # Optional: skipped until the UPDATE_* secrets are set (see docs/UPDATES.md).
          if [ -z "$SSH_HOST" ]; then echo "UPDATE_SSH_HOST is not set; skipping the update feed upload."; exit 0; fi
          # The server's host key is pinned from a secret, so a changed or spoofed server is refused instead of trusted.
          if [ -z "$SSH_HOST_KEY" ]; then echo "UPDATE_SSH_HOST_KEY is not set; refusing to upload without a pinned server key (see docs/UPDATES.md)." >&2; exit 1; fi
          mkdir -p ~/.ssh && printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s %s\n' "$SSH_HOST" "$SSH_HOST_KEY" > ~/.ssh/known_hosts
          ssh_opts=(-i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$HOME/.ssh/known_hosts")
          target="$SSH_USER@$SSH_HOST:$DEPLOY_DIR/updates/"
          ssh "${ssh_opts[@]}" "$SSH_USER@$SSH_HOST" "mkdir -p '$DEPLOY_DIR/updates'"
          # Installer and blockmap first, latest.yml last, so clients never see a version whose file is missing.
          scp "${ssh_opts[@]}" dist/win/Chatward-Setup.exe dist/win/*.blockmap "$target"
          scp "${ssh_opts[@]}" dist/win/latest.yml "$target"
